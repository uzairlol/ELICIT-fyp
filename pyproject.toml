[build-system]
requires = ["setuptools>=68", "wheel"]
# setuptools.backends.legacy was removed in recent setuptools; build_meta is
# the stable, long-supported backend for `pip install -e ".[dev]"` in CI.
build-backend = "setuptools.build_meta"

# ---------------------------------------------------------------------------
# Project metadata
# ---------------------------------------------------------------------------
[project]
name = "elicit"
version = "0.1.0"
description = "ELICIT - Emergent LLM Institutions for Climate and International Treaties"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"

dependencies = [
    "openai>=1.0.0",
    "backoff>=2.2.1",
    "matplotlib",
    "numpy",
    "pandas",
    "pyyaml>=6.0",
    "wordcloud",
]

[project.scripts]
# The grid execution layer. A run is defined by a versioned config, not by a
# hand-edit to parameters.py, so cells travel into a Kaggle notebook as a file.
elicit = "cli.__main__:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pandas-stubs",
    "types-setuptools",
    "types-PyYAML",
]

# ---------------------------------------------------------------------------
# Setuptools - tell it where to find packages (src layout)
# ---------------------------------------------------------------------------
[tool.setuptools.packages.find]
where = ["src"]
# The analysis and CLI packages are importable top-level packages and must be in
# SOURCES.txt; the stale egg-info previously omitted them, which made an
# installed copy silently miss the whole analysis pipeline.
include = ["core*", "llm*", "parsing*", "prompts*", "modules*", "analysis*", "cli*", "kaggle*", "tests*"]

# ---------------------------------------------------------------------------
# Ruff - linting + formatting (replaces flake8, isort, black)
# ---------------------------------------------------------------------------
[tool.ruff]
src = ["src"]
target-version = "py311"
line-length = 100
exclude = ["docs"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",   # line too long - handled by formatter
    "B008",   # do not perform function calls in default args
    "SIM108", # ternary operator - sometimes less readable
]

[tool.ruff.lint.isort]
known-first-party = [
    "cli",
    "core",
    "llm",
    "parsing",
    "prompts",
    "modules",
    "analysis",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

# ---------------------------------------------------------------------------
# Mypy - static type checking
# ---------------------------------------------------------------------------
[tool.mypy]
# Type-check against 3.12: numpy>=2.4 bundles .pyi stubs that use Python
# 3.12-only `type[...]` syntax and cannot be parsed at python_version 3.11.
# Requires-python stays >=3.11; the source itself is 3.11-compatible.
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true

# -----------------------------------------------------------------------
# SCOPE OF THE TYPE CHECK
# -----------------------------------------------------------------------
# Strict (zero errors) on the simulation engine and the grid layer the revamp
# introduced: core, llm, modules, parsing, prompts, cli, analysis.best_response,
# analysis.governance, analysis.variance, analysis.revamp_run_all.
#
# Two areas are excluded, deliberately and with reasons:
#
#   src/tests/               Tests index Optional interval bounds on purpose —
#                           the assertion IS that the bound is present, so
#                           `result["lower"] <= result["estimate"]` cannot be
#                           narrowed to floats without rewriting the assertion
#                           into something weaker. Typing the helpers instead
#                           would be real work of low value: the tests are
#                           already exhaustive (400+ cases) and CI runs them.
#
#   src/analysis/qwen_9seed/ Pre-existing Optional-narrowing gaps in the
#                           nine-seed data-wrangling layer. Untouched by the
#                           revamp, and every fix there changes code that
#                           produces already-reported numbers, so it is scheduled
#                           as its own reviewable change rather than folded into
#                           one that cannot be reviewed against its own diff.
#
# Neither exclusion is a statement that the code is clean. `ruff check` and
# `pytest` cover both areas, and both run on every push.
exclude = ["docs", "src/tests", "src/analysis/qwen_9seed"]

warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = false
disallow_any_generics = false

# ---------------------------------------------------------------------------
# Scope of the type check — read this before assuming "mypy is green" means
# "the whole repository is type-clean".
# ---------------------------------------------------------------------------
# Strict (zero errors) on the simulation engine and the grid layer the revamp
# introduced: core, llm, modules, parsing, prompts, cli, analysis.best_response,
# analysis.governance, analysis.variance, analysis.revamp_run_all.
#
# Excluded, with reasons rather than by accident:
#
#   src/tests/                 Tests index Optional interval bounds on purpose —
#                             the assertion *is* that the bound is present, so
#                             `result["lower"] <= result["estimate"]` cannot be
#                             narrowed to floats without rewriting the assertion
#                             into something weaker.
#   src/analysis/qwen_9seed/   Pre-existing Optional-narrowing gaps in the
#                             nine-seed data-wrangling layer. Untouched by the
#                             revamp, and every fix there changes code that
#                             produces already-reported numbers, so it is
#                             scheduled as its own piece of work rather than
#                             folded into a change that cannot be reviewed
#                             against its own diff.
[[tool.mypy.overrides]]
# matplotlib and wordcloud ship no stubs; ignoring only the missing import keeps
# every other check on the plotting modules live.
module = [
    "matplotlib.*",
    "wordcloud.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths  = ["src/tests"]
pythonpath = ["src"]
addopts    = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--color=yes",
]
markers = [
    "slow: marks tests as slow (deselect with -m 'not slow')",
    "integration: marks tests that require a live LLM endpoint",
    "unit: marks pure-logic unit tests",
]

[tool.coverage.run]
source = ["src"]
omit   = ["src/tests/*", "src/run_experiments.py", "src/main.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false