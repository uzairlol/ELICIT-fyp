[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

# ---------------------------------------------------------------------------
# Project metadata
# ---------------------------------------------------------------------------
[project]
name = "elicit"
version = "0.1.0"
description = "ELICIT - Emergent LLM Institutions for Climate and International Treaties"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"

dependencies = [
    "openai>=1.0.0",
    "backoff>=2.2.1",
    "matplotlib",
    "numpy",
    "pandas",
    "wordcloud",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pandas-stubs",
    "types-setuptools",
]

# ---------------------------------------------------------------------------
# Setuptools - tell it where to find packages (src layout)
# ---------------------------------------------------------------------------
[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------
# Ruff - linting + formatting (replaces flake8, isort, black)
# ---------------------------------------------------------------------------
[tool.ruff]
src = ["src"]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",   # line too long - handled by formatter
    "B008",   # do not perform function calls in default args
    "SIM108", # ternary operator - sometimes less readable
]

[tool.ruff.lint.isort]
known-first-party = [
    "core",
    "llm",
    "parsing",
    "prompts",
    "modules",
    "analysis",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

# ---------------------------------------------------------------------------
# Mypy - static type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
mypy_path = "src"
explicit_package_bases = true

warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = false
disallow_any_generics = false

[[tool.mypy.overrides]]
module = [
    "matplotlib.*",
    "wordcloud.*",
    "backoff.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths  = ["src/tests"]
pythonpath = ["src"]
addopts    = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--color=yes",
]
markers = [
    "slow: marks tests as slow (deselect with -m 'not slow')",
    "integration: marks tests that require a live LLM endpoint",
    "unit: marks pure-logic unit tests",
]

[tool.coverage.run]
source = ["src"]
omit   = ["src/tests/*", "src/run_experiments.py", "src/main.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
