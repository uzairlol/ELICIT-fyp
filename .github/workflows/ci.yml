name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    name: ruff + mypy + pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff check)
        run: python -m ruff check src

      - name: Formatting (ruff format --check)
        run: python -m ruff format --check src

      - name: Type check (mypy)
        run: python -m mypy src

      - name: Tests (pytest)
        run: python -m pytest -q

      # The grid is 164 runs of real compute, so the manifests are validated on
      # every push rather than discovered at launch. Parity is the property that
      # makes "model effect" mean model, so it is a gate, not a warning.
      - name: Grid manifests expand and hold parameter parity
        run: |
          for grid in configs/grid_*.yaml; do
            echo "--- $grid"
            python -m cli grid show --grid "$grid"
          done

      - name: No unread parameters
        # `--json` so the exit-status check can be a real gate; the human-readable
        # table is for humans and prints a header before the count.
        run: |
          unread=$(python -m cli params --unread-only --json)
          echo "$unread"
          test "$unread" = "[]"